# No application data, secrets or published ports. PostgreSQL storage is disposable.
services:
  postgres-test:
    image: postgres:17-alpine
    mem_limit: 512m
    environment:
      POSTGRES_DB: invoice_payments_test
      POSTGRES_USER: billing_test
      POSTGRES_PASSWORD: disposable-test-only
    command: [postgres, -p, "15432"]
    tmpfs: [/var/lib/postgresql/data]
    volumes:
      - ./scripts/test-databases.sql:/docker-entrypoint-initdb.d/test-databases.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U billing_test -d invoice_payments_test -p 15432"]
      interval: 3s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: .
      dockerfile: Dockerfile.java
      target: verification
    mem_limit: 2304m
    network_mode: service:postgres-test
    depends_on:
      postgres-test: {condition: service_healthy}
    environment:
      MAVEN_OPTS: -Xmx384m
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=40
      BILLING_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:15432/invoice_payments_test
      BILLING_TEST_DB_USER: billing_test
      BILLING_TEST_DB_PASSWORD: disposable-test-only
      BILLING_LAB_JDBC_URL: jdbc:postgresql://127.0.0.1:15432/invoice_payments_simulation_test
      BILLING_LAB_DB_USER: billing_test
      BILLING_LAB_DB_PASSWORD: disposable-test-only
