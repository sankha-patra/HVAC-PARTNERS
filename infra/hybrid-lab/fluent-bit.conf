# Ships the laptop's alert sources to CloudWatch Logs (infra/aws-hybrid-alerts).
#   hybrid.billing / hybrid.postgres : container stdout via Docker's fluentd log driver (docker logs keeps working)
#   hybrid.docker_events             : container die/oom events from the Docker socket (scenario 4 exit codes)
#   hybrid.shipper                   : "alive" every 60 s, so AWS can tell a dead app from a sleeping laptop
# Credentials: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY of the payments-hybrid-telemetry user (logs:PutLogEvents on
# these groups only), from an env file that is never committed. Lines are buffered on disk while AWS is unreachable.

[SERVICE]
    Flush                     5
    Log_Level                 warn
    storage.path              /fluent-bit/buffer
    storage.sync              normal
    storage.backlog.mem_limit 16M
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224
    storage.type  filesystem

[INPUT]
    Name          docker_events
    Tag           hybrid.docker_events
    Unix_Path     /var/run/docker.sock
    storage.type  filesystem

[INPUT]
    Name          dummy
    Tag           hybrid.shipper
    Dummy         {"shipper":"alive"}
    Interval_Sec  60

# The event stays the raw JSON Docker sent (key "message"); CloudWatch's JSON filter reads it as is. Only container
# die/oom events are kept: health checks alone produce an exec event every few seconds. Docker 25+ events carry
# Type/Action (no legacy status field).
[FILTER]
    Name          grep
    Match         hybrid.docker_events
    Regex         message "Type":"container"
    Regex         message "Action":"(die|oom)"
    # Only the containers infra/aws-hybrid-alerts watches (var.watched_containers); other stacks are not shipped.
    Regex         message "name":"payments-rzp-failures-(billing|postgres|kafka|connect)-1"

[OUTPUT]
    Name               cloudwatch_logs
    Match              hybrid.billing
    region             ${AWS_REGION}
    log_group_name     /payments-hybrid/billing
    log_stream_name    billing
    log_key            log
    auto_create_group  false
    Retry_Limit        no_limits

[OUTPUT]
    Name               cloudwatch_logs
    Match              hybrid.postgres
    region             ${AWS_REGION}
    log_group_name     /payments-hybrid/postgres
    log_stream_name    postgres
    log_key            log
    auto_create_group  false
    Retry_Limit        no_limits

[OUTPUT]
    Name               cloudwatch_logs
    Match              hybrid.docker_events
    region             ${AWS_REGION}
    log_group_name     /payments-hybrid/docker-events
    log_stream_name    docker-events
    log_key            message
    auto_create_group  false
    Retry_Limit        no_limits

[OUTPUT]
    Name               cloudwatch_logs
    Match              hybrid.shipper
    region             ${AWS_REGION}
    log_group_name     /payments-hybrid/shipper
    log_stream_name    shipper
    auto_create_group  false
    Retry_Limit        no_limits
