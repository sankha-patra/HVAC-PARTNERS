<div class="login-page">
  <form class="glass-panel login-card" (ngSubmit)="submit()">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to continue to Invoice Payments</p>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Username or email</mat-label>
      <input matInput name="username" [(ngModel)]="username" autocomplete="username" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Password</mat-label>
      <input
        matInput
        type="password"
        name="password"
        [(ngModel)]="password"
        autocomplete="current-password"
        required
      />
    </mat-form-field>

    <p class="hint">Buyer: <code>demo</code> / <code>demo123</code> · Admin: <code>admin</code> / <code>admin123</code></p>
    <p class="error" *ngIf="error">{{ error }}</p>

    <button mat-flat-button color="primary" type="submit" class="submit" [disabled]="loading">
      {{ loading ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
