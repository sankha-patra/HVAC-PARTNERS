services:
  postgres-benchmark:
    image: postgres:17-alpine
    mem_limit: 512m
    environment:
      POSTGRES_DB: invoice_payments_test
      POSTGRES_USER: billing_test
      POSTGRES_PASSWORD: disposable-benchmark-only
    command: [postgres, -p, "15432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U billing_test -d invoice_payments_test -p 15432"]
      interval: 2s
      timeout: 2s
      retries: 30
  benchmark:
    image: invoice-payments-tests-tests:latest
    mem_limit: 1536m
    working_dir: /benchmark
    network_mode: service:postgres-benchmark
    depends_on:
      postgres-benchmark: {condition: service_healthy}
    volumes:
      - ./snapshot:/benchmark
    environment:
      MAVEN_OPTS: -Xmx384m
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=35
      BILLING_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:15432/invoice_payments_test
      BILLING_TEST_DB_USER: billing_test
      BILLING_TEST_DB_PASSWORD: disposable-benchmark-only
    command:
      - mvn
      - -B
      - -ntp
      - -Dmaven.repo.local=/opt/maven-cache/repository
      - -pl
      - billing-service
      - '-Dtest=OutboxConnectionBenchmarkTest,BillingFinancialDatabaseTest#eightBrokerWaitsHoldNoPooledConnectionsOrRowLocks'
      - -DargLine=-Xmx512m
      - test
