spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: billing
          uri: ${BILLING_SERVICE_URL:http://127.0.0.1:8084}
          predicates:
            - Path=/api/v1/billing,/api/v1/billing/**,/api/v1/commerce,/api/v1/commerce/**
        - id: identity
          uri: ${AUTH_SERVICE_URL:http://127.0.0.1:8081}
          predicates:
            - Path=/api/v1/auth,/api/v1/auth/**
management:
  endpoints:
    web:
      exposure:
        include: health,info
