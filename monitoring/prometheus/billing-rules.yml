# Demonstration thresholds, not measured production SLOs.
#
# Labels used for routing (see monitoring/alertmanager/alertmanager.example.yml):
#   responder - who sees the alert first and triages it. Always app-team: the application team (the
#               service provider) monitors, fixes its own defects and hands decisions over with evidence.
#   decision  - the client (Carrier) team that decides, or none for technical alerts: carrier-finance,
#               carrier-treasury or carrier-business. The app team never makes these decisions.
#   severity  - critical pages the app team's on-call; warning notifies its channel without paging;
#               info goes only to a queue or digest.
# The cause may lie with Stripe or a bank; these labels say who acts, not who caused it.
# Nothing is delivered until an Alertmanager is deployed and given real destinations.
groups:
  - name: billing-business-alerts
    rules:
      - alert: BillingWebhookNeedsMatching
        expr: billing_webhooks_unmatched > 0
        for: 2m
        labels: {severity: warning, responder: app-team, decision: carrier-finance, environment: local}
        annotations:
          summary: Authenticated payment evidence needs matching or finance review
          description: 'A verified provider event disagrees with our records. App team: confirm it is not our defect, then hand the case to Carrier finance, who decide. Do not discard the inbox record or overwrite a payment status. Temporary technical failures raise BillingWebhookRetrying instead.'
      - alert: BillingWebhookRetrying
        expr: billing_webhooks_retrying_oldest_seconds > 600
        for: 5m
        labels: {severity: warning, responder: app-team, decision: none, environment: local}
        annotations:
          summary: Saved provider events keep failing for a technical reason
          description: 'Events are stored and retry with backoff capped at 5 minutes. Check application errors, database health, locks and timeouts. Finance has no action unless BillingWebhookNeedsMatching also fires.'
      - alert: BillingOutboxNotDraining
        expr: billing_outbox_oldest_seconds > 60
        for: 3m
        labels: {severity: warning, responder: app-team, decision: none, environment: local}
        annotations:
          summary: Committed billing events are not reaching Kafka promptly
          description: Check Kafka availability and publisher retries. Retain the outbox; duplicate delivery is safe for idempotent consumers.
      - alert: BillingDeadLetterNeedsReview
        expr: billing_deadletters_open > 0
        for: 2m
        labels: {severity: warning, responder: app-team, decision: none, environment: local}
        annotations:
          summary: Billing events require audited recovery
          description: Engineering inspects the cause before replay. Operations may replay validated original events; malformed source data requires correction at its owner.
      - alert: BillingPaymentStuck
        expr: billing_payments_stuck_technical > 0
        for: 2m
        labels: {severity: warning, responder: app-team, decision: none, environment: local}
        annotations:
          summary: Payments have had no provider answer for over 15 minutes
          description: 'UNKNOWN or SUBMITTING, measured from payment creation. Check the provider alerts, recovery workers and database. Recovery reuses the original identity; do not create a replacement charge. Overdue user action and long provider processing have their own alerts.'
      - alert: BillingPaymentActionOverdue
        expr: billing_payments_action_overdue > 0
        for: 30m
        labels: {severity: info, responder: app-team, decision: carrier-business, environment: local}
        annotations:
          summary: Payments still wait for the paying user after 24 hours
          description: 'Nobody is paged. App team: if Stripe shows the session complete or expired, recovery missed the outcome and the fix is ours (hosted Checkout sessions expire after 24 hours by default). Otherwise ask the Carrier business contact to follow up with the paying company.'
      - alert: BillingPaymentProcessingOverdue
        expr: billing_payments_processing_overdue > 0
        for: 30m
        labels: {severity: warning, responder: app-team, decision: carrier-treasury, environment: local}
        annotations:
          summary: Payments are still processing 7 days after creation
          description: 'App team: attach the provider evidence to the case and hand it to Carrier treasury, who follow up with the bank. Age alone is not a failure: never fail, reverse or replace the payment without verified provider evidence.'
      - alert: BillingRefundStuck
        expr: billing_refunds_stuck_technical > 0
        for: 2m
        labels: {severity: warning, responder: app-team, decision: none, environment: local}
        annotations:
          summary: Approved refunds have had no provider answer for over 15 minutes
          description: 'Approved but not sent, or sent with no answer. Check the provider alerts and refund recovery. Do not issue a replacement refund until the original is resolved.'
      - alert: BillingRefundProcessingOverdue
        expr: billing_refunds_processing_overdue > 0
        for: 30m
        labels: {severity: warning, responder: app-team, decision: carrier-treasury, environment: local}
        annotations:
          summary: Refunds are still pending 7 days after submission
          description: 'App team: attach the provider evidence and hand it to Carrier treasury; a refund can wait for the Stripe balance. A pending or failed refund never triggers another refund; Carrier finance approves any alternative reimbursement.'
      - alert: BillingReleaseAwaitingApproval
        expr: billing_cases_awaiting_approval > 0
        for: 30m
        labels: {severity: warning, responder: app-team, decision: carrier-finance, environment: local}
        annotations:
          summary: A stuck-payment release is waiting for a second approver
          description: 'A different Carrier approver must review the request; the app team cannot approve it. The invoice stays reserved until then.'

  # These rules read billing_provider_requests_total{outcome,category,operation} and the
  # billing_provider_request_seconds histogram. They stay silent until the provider adapter exports them.
  # Card declines happen inside hosted Checkout and are not provider request failures, so nothing here pages on them.
  - name: billing-provider-alerts
    rules:
      - alert: BillingProviderCredentialsRejected
        # The gauge catches the very first rejection even before a counter baseline was scraped.
        expr: max by (operation) (billing_provider_credentials_rejected) > 0
        labels: {severity: critical, responder: app-team, decision: none, environment: local}
        annotations:
          summary: The payment provider refused our credentials or permissions
          description: 'A request was denied because of credentials or permissions. Check the configured key and access for this operation. Earlier payment attempts may still exist; preserve their identity and verify them after access is restored.'
      - alert: BillingProviderRequestsInvalid
        expr: max by (operation) (billing_provider_requests_invalid) > 0
        labels: {severity: warning, responder: app-team, decision: none, environment: local}
        annotations:
          summary: The payment provider rejected requests as invalid
          description: 'Inspect the invalid request and the restricted provider evidence in the finance workspace. Correct our request or configuration; the HTTP error alone does not prove that an earlier operation failed.'
      - alert: BillingProviderThrottled
        expr: sum by (operation, category) (increase(billing_provider_requests_total{outcome="rate_limited"}[5m])) > 5
        for: 5m
        labels: {severity: warning, responder: app-team, decision: none, environment: local}
        annotations:
          summary: Payment provider requests are being throttled
          description: 'Check our offered load and concurrent requests before blaming the provider. Inspect the retained rate-limit reason. Preserve the original operation identity and use backoff; do not infer that an earlier payment was never created.'
      - alert: BillingProviderOutcomeUncertain
        expr: >-
          (
            sum by (operation) (increase(billing_provider_requests_total{outcome="uncertain"}[5m]))
            / clamp_min(sum by (operation) (increase(billing_provider_requests_total[5m])), 1)
            > 0.2
          )
          and on (operation)
          (sum by (operation) (increase(billing_provider_requests_total[5m])) >= 10)
        for: 5m
        labels: {severity: warning, responder: app-team, decision: none, environment: local}
        annotations:
          summary: Many payment provider calls ended without a clear answer
          description: 'Timeouts, lost connections or provider server errors. The cause may be our network or egress, or the provider: check its status page. Affected payments stay UNKNOWN and recovery reuses the original identity; never create a replacement payment.'
      - alert: BillingProviderLatencyHigh
        expr: >-
          (histogram_quantile(0.95, sum by (operation, le) (rate(billing_provider_request_seconds_bucket[10m]))) > 5)
          and on (operation)
          (sum by (operation) (increase(billing_provider_request_seconds_count[10m])) >= 10)
        for: 10m
        labels: {severity: warning, responder: app-team, decision: none, environment: local}
        annotations:
          summary: Payment provider calls are slow
          description: 'The 95th percentile is above 5 seconds against a 10-second request timeout. Slow calls hold request threads. Compare our egress and connection-pool waits with the provider status page before scaling.'
  - name: billing-kafka-alerts
    rules:
      - alert: BillingKafkaConsumerLagging
        # Micrometer reports the largest lag each billing consumer saw in its recent fetches.
        expr: max by (client_id) (kafka_consumer_fetch_manager_records_lag_max) > 1000
        for: 10m
        labels: {severity: warning, responder: app-team, decision: none, environment: local}
        annotations:
          summary: A billing Kafka consumer is falling behind
          description: 'Events are waiting in Kafka. Nothing is lost: payments are already committed and the outbox keeps every event. Check consumer errors, rebalances, slow database writes and partition count. Never reset offsets or skip records to catch up.'
  - name: billing-dispute-alerts
    rules:
      - alert: BillingDisputeNeedsResponse
        expr: billing_disputes_needing_response > 0
        for: 5m
        labels: {severity: warning, responder: app-team, decision: carrier-finance, environment: local}
        annotations:
          summary: A bank dispute or inquiry needs Carrier finance to respond
          description: "A paying company's bank opened a dispute or an inquiry on a card payment. Carrier finance responds in Carrier's Stripe Dashboard before the deadline shown in the finance workspace: an unanswered dispute is lost, and an unanswered inquiry can become a chargeback. App team: check the messages arrived and hand it over (docs/carrier-handoff-runbook.md)."
      - alert: BillingDisputeDeadlineNear
        expr: billing_disputes_response_due_soon > 0
        for: 1m
        labels: {severity: warning, responder: app-team, decision: carrier-finance, environment: local}
        annotations:
          summary: A dispute or inquiry response is due within 48 hours
          description: "Carrier finance must respond in Carrier's Stripe Dashboard before the deadline shown in the finance workspace. An inquiry takes no money yet but can become a chargeback; an unanswered dispute is lost."
