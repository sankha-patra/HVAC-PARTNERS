groups:
  - name: billing-business-alerts
    rules:
      - alert: BillingWebhookNeedsMatching
        expr: billing_webhooks_unmatched > 0
        for: 2m
        labels: {severity: warning, environment: local}
        annotations:
          summary: Authenticated payment evidence needs matching or finance review
          description: Open the finance exception queue; do not discard the inbox record or overwrite a payment status.
      - alert: BillingOutboxNotDraining
        expr: billing_outbox_oldest_seconds > 60
        for: 3m
        labels: {severity: warning, environment: local}
        annotations:
          summary: Committed billing events are not reaching Kafka promptly
          description: Check Kafka availability and publisher retries. Retain the outbox; duplicate delivery is safe for idempotent consumers.
      - alert: BillingDeadLetterNeedsReview
        expr: billing_deadletters_open > 0
        for: 2m
        labels: {severity: warning, environment: local}
        annotations:
          summary: Billing events require audited recovery
          description: Inspect the cause before replay. Operations may replay validated original events; malformed source data requires correction at its owner.
      - alert: BillingPaymentStuck
        expr: billing_payments_stuck > 0
        for: 2m
        labels: {severity: warning, environment: local}
        annotations:
          summary: Unresolved billing payments exceeded their recovery deadline
          description: 'Review provider lookup and the finance exception queue. Deadlines: uncertain/submitting 15 minutes, customer action 24 hours, processing 7 days. Do not create a replacement charge blindly.'
      - alert: BillingRefundStuck
        expr: billing_refunds_stuck > 0
        for: 2m
        labels: {severity: warning, environment: local}
        annotations:
          summary: Approved refunds exceeded their recovery deadline
          description: 'Open the refund case in the finance workspace. Deadlines: approved or uncertain 15 minutes, provider pending 7 days. Do not issue a replacement refund until the original is resolved.'
      - alert: BillingReleaseAwaitingApproval
        expr: billing_cases_awaiting_approval > 0
        for: 30m
        labels: {severity: warning, environment: local}
        annotations:
          summary: A stuck-payment release is waiting for a second approver
          description: 'A different authorized approver must review the request. The invoice stays reserved until then; do not approve your own request.'
