global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules.yml
  - /etc/prometheus/billing-rules.yml
scrape_configs:
  - job_name: invoice-payments
    metrics_path: /actuator/prometheus
    scrape_timeout: 5s
    static_configs:
      - targets: [identity-service:9090]
        labels: {service: identity-service}
      - targets: [billing-service:9090]
        labels: {service: billing-service}
      - targets: [api-gateway:9090]
        labels: {service: api-gateway}
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
