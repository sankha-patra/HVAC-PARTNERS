rule_files:
  - billing-rules.yml
evaluation_interval: 1m
tests:
  - name: unmatched-webhook-is-visible-after-grace
    interval: 1m
    input_series:
      - series: billing_webhooks_unmatched
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: BillingWebhookNeedsMatching
        exp_alerts: []
      - eval_time: 3m
        alertname: BillingWebhookNeedsMatching
        exp_alerts:
          - exp_labels: {severity: warning, environment: local}
            exp_annotations:
              summary: Authenticated payment evidence needs matching or finance review
              description: 'Open the finance exception queue; do not discard the inbox record or overwrite a payment status.'
  - name: old-outbox-event-alerts-without-failing-on-a-young-event
    interval: 1m
    input_series:
      - series: billing_outbox_oldest_seconds
        values: '120+0x6'
    alert_rule_test:
      - eval_time: 2m
        alertname: BillingOutboxNotDraining
        exp_alerts: []
      - eval_time: 4m
        alertname: BillingOutboxNotDraining
        exp_alerts:
          - exp_labels: {severity: warning, environment: local}
            exp_annotations:
              summary: Committed billing events are not reaching Kafka promptly
              description: 'Check Kafka availability and publisher retries. Retain the outbox; duplicate delivery is safe for idempotent consumers.'
  - name: open-dead-letter-is-visible-after-grace
    interval: 1m
    input_series:
      - series: billing_deadletters_open
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: BillingDeadLetterNeedsReview
        exp_alerts:
          - exp_labels: {severity: warning, environment: local}
            exp_annotations:
              summary: Billing events require audited recovery
              description: 'Inspect the cause before replay. Operations may replay validated original events; malformed source data requires correction at its owner.'
